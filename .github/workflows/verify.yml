name: Verify

# This workflow is the mechanical guardrail against the failure mode this repo
# actually experienced: PRs that reported completion while nothing ran. If it
# does not build, test, and lint, it cannot merge.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Test
        run: CI=true npm run test

      - name: Lint
        run: npm run lint

      # The invariant gate runs inside `npm test` (see package.json). It is not duplicated here:
      # two copies of one check drift apart, and the previous inline `grep` guard was exactly the
      # fragile policing AGENTS.md §10.2 warns about. `scripts/invariant-checks.mjs` is unit-tested
      # by `__tests__/invariant-checks.test.mjs`, so its detection logic is verified rather than
      # assumed.
      - name: Invariant gate (also asserted by npm test)
        run: node scripts/verify-invariants.mjs

  verify-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo check
        run: cargo check
